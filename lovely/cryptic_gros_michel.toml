[manifest] # Header for the file, this should only be here once at the beginning
version = "1.0.0"
priority = 0      # Priority for loading the file

[[patches]]
[patches.pattern]
target = 'card.lua' # The file you want to patch.
pattern = "if self.ability.name == 'Gros Michel' then G.GAME.pool_flags.gros_michel_extinct = true end"
position = "after"
payload = '''
if self.ability.name == 'Cavendish' then
    G.GAME.pool_flags.dzhrj_cavendish_extinct = true
    check_for_unlock({type="dzhrj_cavendish_extinct"})
end
'''
match_indent = true
