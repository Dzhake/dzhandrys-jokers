[manifest] # Header for the file, this should only be here once at the beginning
version = "1.0.0"
priority = 0      # Priority for loading the file

# CardArea:shuffle()
[[patches]]
[patches.pattern]
target = "cardarea.lua"
pattern = "pseudoshuffle(self.cards, pseudoseed(_seed or 'shuffle'))"
position = "after"
payload = '''
if self == G.deck then
    local martins = SMODS.find_card("j_dzhrj_martin")
    if #martins > 0 then
        -- Create a temporary list of cards that should be put on top
        local targets = {}
        for i = #self.cards, 1, -1 do
            if self.cards[i].ability.dzhrj_played_this_round then
                targets[self.cards[i]] = true
            end
        end

        -- Pull them out of the deck and re-insert them at the end (the top)
        for i = #self.cards, 1, -1 do
            if targets[self.cards[i]] then
                local card = table.remove(self.cards, i)
                table.insert(self.cards, card)
            end
        end
    end
end
'''
match_indent = true
